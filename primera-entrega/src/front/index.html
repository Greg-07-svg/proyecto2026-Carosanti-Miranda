<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FINDG</title>

    <link rel="stylesheet" href="normalizado.css">
    <!--primero este para normalizar y no repetir de mas, luego el especifico-->

    <link rel="stylesheet" href="index.css">

    <script src="principal.js"></script>
</head>

<!--dentro de cada seccion (header, footer, section) planteamos un div que contenga el todo, y un div por contenido especifico dentro del div de contenedor-->
<!-- asi para poder facilitar el planteo del disenio en css-->

<body onload="juegoPrincipal()">
    <header class="header">
        <div class="header-container">
            <a href="index.html" class="icon-container">
                <img src="imagenes/favicon.ico" alt="icono" class="icon">
                <h1 class="header-page-title">FINDG</h1>
            </a>

            <nav class="nav-menu">
                <a href="explore.html" class="nav-icon"> EXPLORAR </a>
                <a href="favourite.html" class="nav-icon"> FAVORITOS </a>
            </nav>
        </div>
    </header>

    <main class="main-content">

        <section class="hero-section" id="hero">
            <div class="hero-overlay">
                <div class="hero-container" id="hero-container">
                    <!--se realiza la carga de los mockups a traves del js, con el event listener sobre el body. -->
                </div>
            </div>
        </section>


        <section id="section-trends">
            <h2 class="section-title">Tendencias</h2>

            <div class="games-container" id="trend-games-container">
                <div class="card-skeleton">
                    cargando carta
                </div>
            </div>
        </section>

        <section class="section-categories">
            <h2 class="section-title">Categorías</h2>

            <div class="categories-grid">
                <a href="explore.html?category=action" class="category-card">
                    Acción
                </a>
                <a href="explore.html?category=indie" class="category-card">
                    Aventura
                </a>
                <a href="explore.html?category=role-playing-games-rpg" class="category-card">
                    RPG
                </a>
                <a href="explore.html?category=strategy" class="category-card">
                    Estrategia
                </a>
                <a href="explore.html?category=sports" class="category-card">
                    Deportes
                </a>
                <a href="explore.html?category=puzzle" class="category-card">
                    Puzzle
                </a>
            </div>
        </section>

    </main>

    <footer class="footer">
        <div class="footer-container">
            <span>datos proporcionados por la API de RAWG (free tier) </span>
            <span><small>©2026 Lucca Carosanti Gregorio Miranda </small></span>
        </div>
    </footer>

</body>

</html>
