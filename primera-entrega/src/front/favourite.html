<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Lucca Carosanti, Gregorio Miranda">
    <meta name="description" content="FINDG: tu biblioteca de videojuegos favoritos, con su rating y acceso directo a los detalles.">
    <meta name="keywords" content="favoritos, biblioteca, videojuegos guardados, rating, juegos, FINDG">
    <title>FINDG_Favoritos</title>

    <link rel="stylesheet" href="normalizado.css"> <!--primero el normalizado y dsp el especifico-->
    <link rel="stylesheet" href="favourite.css">
</head>

<body onload="cargarFavoritos();">
    <header class="header">
        <div class="header-container">
            <a href="index.html" class="icon-container">
                <img src="imagenes/favicon.ico" alt="icono" class="icon">
                <h1 class="header-page-title">FINDG</h1>
            </a>

            <nav class="nav-menu">
                <a href="explore.html" class="nav-icon"> EXPLORAR </a>
                <a href="favourite.html" class="nav-icon active"> FAVORITOS </a>
            </nav>
        </div>
    </header>

    <main class="main-content">
        <div class="container">

            <p class="fav-breadcrumb">Mi cuenta / Biblioteca de favoritos</p>

            <div class="fav-head">
                <div>
                    <h1 class="fav-title">Mis favoritos</h1>
                </div>
                <span class="fav-count" id="fav-count">0 juegos guardados</span>
            </div>

            <div class="fav-layout">

                <!-- LISTA: las tarjetas las genera el favourite.js -->
                <section class="fav-list" id="fav-list">
                    <p class="fav-msg">Cargando favoritos…</p>
                </section>

                <!-- RESUMEN LATERAL -->
                <aside class="panel">
                    <h2 class="panel-title">Resumen</h2>
                    <div id="summary-list"></div>
                </aside>

            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="footer-container">
            <span>datos proporcionados por la API de RAWG (free tier) </span>
            <span><small>©2026 Lucca Carosanti Gregorio Miranda </small></span>
        </div>
    </footer>

    <script src="principal.js"></script>
</body>

</html>
