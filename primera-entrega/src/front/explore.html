<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Lucca Carosanti, Gregorio Miranda">
    <meta name="description" content="FINDG: explorá el catálogo de videojuegos y filtrá por nombre, categoría, rating mínimo y año de lanzamiento.">
    <meta name="keywords" content="explorar, catálogo, videojuegos, filtros, categoría, rating, año de lanzamiento, FINDG">
    <title>FINDG_Explorar</title>

    <link rel="stylesheet" href="normalizado.css">
    <link rel="stylesheet" href="explore.css">

    <script src="principal.js"></script>
</head>
<body onload="cargarExplorados(); cantidadFiltrados()">
    <!--AGREGAR OM QUITAR DEPENDIENDO DE LA PAGINA COSAS AL HEADER Y FOOTER (USAR MISMAS CLASES !!!)-->
    <header class="header">
        <div class="header-container">
            <a href="index.html" class="icon-container">
                <img src="imagenes/favicon.ico" alt="icono" class="icon">
                <h1 class="header-page-title">FINDG</h1>
            </a>
            
            <nav class="nav-menu">
                <a href="explore.html" class="nav-icon"> EXPLORAR </a>
                <a href="favourite.html" class="nav-icon"> FAVORITOS </a>
            </nav>
        </div>
    </header>

    <main class="main-content explore-layout">

        
        <aside class="filters-sidebar">

            <form id="filters-form" >
                
                <fieldset class="filter-group">
                    <label for="search-input">BUSCAR</label>
                    <input type="text" id="search-input" placeholder="Nombre del juego..." size="20" maxlength="55">
                </fieldset>

                <fieldset class="filter-group">
                    <label for="category-select">CATEGORÍA</label>
                    <select id="category-select">
                        <option value="">Todos los géneros</option>
                        <option value="action">Acción</option>
                        <option value="indie">Aventura</option>
                        <option value="role-playing-games-rpg">RPG</option>
                        <option value="strategy">Estrategia</option>
                        <option value="sports">Deportes</option>
                        <option value="shooter">Shooter</option>
                        <option value="racing">Carreras</option>
                        <option value="puzzle">Puzzle</option>
                    </select>
                </fieldset>

                <fieldset class="filter-group">
                    <div class="filter-label-row">
                        <label for="rating-range">RATING MÍNIMO</label>
                        <span id="rating-value" class="rating-badge-val">0.0+</span>
                    </div>
                    <input type="range" id="rating-range" min="0" max="5" step="0.5" value="0">
                </fieldset>

                <fieldset class="filter-group">
                    <label for="year-input">AÑO DE LANZAMIENTO</label>
                    <input type="number" id="year-input" placeholder="Ej. 2023, 2024" min="1980" max="2026">
                </fieldset>

                <fieldset class="filter-actions">
                    <button type="submit" class="btn">Aplicar Filtros</button>
                    <button type="button" id="btn-reset" class="btn">Reiniciar</button>
                </fieldset>

            </form>
        </aside>

        <section class="results-section">
            
            <div class="results-header">
                <h1 class="page-title">Explorar Juegos</h1>
                <span id="results-count" class="results-count">Cargando juegos...</span>
            </div>

            <div id="explore-grid">
                <!-- Se inyecta dinámicamente con JS (explore.js) -->
                <div class="card-skeleton">Cargando catálogo...</div>
            </div>

        </section>

    </main>
    
    <footer class="footer">
        <div class="footer-container">
            <span>datos proporcionados por la API de RAWG (free tier) </span>
            <span><small>©2026 Lucca Carosanti Gregorio Miranda </small></span>
        </div>
    </footer>
</body>
</html>
